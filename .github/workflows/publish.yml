name: publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/*/package.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish packages
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check for pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' -print -quit | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changesets.outputs.pending == 'false'
        run: bun run build
      - if: steps.changesets.outputs.pending == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.changesets.outputs.pending == 'false'
        run: npm install --global npm@latest
      - name: Configure temporary npm token
        if: steps.changesets.outputs.pending == 'false' && env.NPM_TOKEN != ''
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
      - name: Check package version
        if: steps.changesets.outputs.pending == 'false'
        id: package
        run: |
          name="$(bun pm pkg get name --cwd packages/syntax | tr -d '"')"
          version="$(bun pm pkg get version --cwd packages/syntax | tr -d '"')"
          if output="$(cd "$RUNNER_TEMP" && npm view "$name@$version" version --json 2>&1)"; then
            published=true
          elif grep -q E404 <<< "$output"; then
            published=false
          else
            printf '%s\n' "$output"
            exit 1
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Publish package
        if: steps.changesets.outputs.pending == 'false' && steps.package.outputs.published == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cd packages/syntax
          tarball="$(bun pm pack --destination "$RUNNER_TEMP/publish" --quiet | tr -d '[:space:]')"
          cd "$RUNNER_TEMP"
          npm publish "$tarball" --access public
      - name: Push Changesets tags
        if: steps.changesets.outputs.pending == 'false'
        run: |
          bun run changeset tag
          git push --follow-tags
