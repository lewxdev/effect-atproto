name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish packages
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check for pending changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' -print -quit | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changesets.outputs.pending == 'false'
        run: bun run build
      - if: steps.changesets.outputs.pending == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.changesets.outputs.pending == 'false'
        run: npm install --global npm@latest
      - name: Configure temporary npm token
        if: steps.changesets.outputs.pending == 'false' && env.NPM_TOKEN != ''
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
      - name: Publish packages
        if: steps.changesets.outputs.pending == 'false'
        run: bun run changeset publish
      - if: steps.changesets.outputs.pending == 'false'
        run: git push --follow-tags
