name: publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish packages
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Require main
        run: test "$GITHUB_REF_NAME" = "main"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:peers
      - run: bun run build
      - run: bun run test
      - run: bun run docgen
      - run: bun run fmt:check
      - run: bun run ts:check
      - name: Read package tag
        id: package
        run: bun scripts/package-tag.ts packages/syntax
      - name: Check package tag
        id: tag
        run: bun scripts/check-package-tag.ts "${{ steps.package.outputs.tag }}"
      - name: Dry-run pack
        if: steps.tag.outputs.exists == 'false'
        working-directory: packages/syntax
        run: bunx npm@latest pack --dry-run --json --workspaces=false
      - name: Configure temporary npm token
        if: steps.tag.outputs.exists == 'false' && env.NPM_TOKEN != ''
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
      - name: Publish with temporary token
        if: steps.tag.outputs.exists == 'false' && env.NPM_TOKEN != ''
        working-directory: packages/syntax
        run: bunx npm@latest publish --workspaces=false --provenance --access public
      - name: Publish with trusted publishing
        if: steps.tag.outputs.exists == 'false' && env.NPM_TOKEN == ''
        working-directory: packages/syntax
        run: bunx npm@latest publish --workspaces=false --access public
      - name: Push Changesets tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          bunx changeset tag
          git push origin "refs/tags/${{ steps.package.outputs.tag }}"
      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.package.outputs.tag }}" --title "${{ steps.package.outputs.tag }}" --generate-notes
      - name: Skip existing package tag
        if: steps.tag.outputs.exists == 'true'
        run: echo "Skipping publish because tag ${{ steps.package.outputs.tag }} already exists."
