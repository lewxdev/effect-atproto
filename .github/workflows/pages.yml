name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - run: bun run check:peers
      - run: bun run build
      - run: bun run test
      - run: bun run docgen
      - run: bun run docs:site
      - run: bun run fmt:check
      - run: bun run ts:check
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
